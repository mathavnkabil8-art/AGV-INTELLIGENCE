<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" style="background:#0b0f19; font-family:system-ui, -apple-system, sans-serif;">
<defs>
  <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#06b6d4"/>
  </linearGradient>
</defs>
<text x="40" y="38" fill="#f8fafc" font-size="20" font-weight="700">Ordinary Generating Functions (OGF) for Energy Distribution</text>
<text x="40" y="60" fill="#94a3b8" font-size="12">Benchmark Case: 4 Charging Bays × 100 kWh Backup Power | Minimum Reserve: 15 kWh/bay</text>
<rect x="40" y="90" width="420" height="450" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
<text x="56" y="120" fill="#38bdf8" font-size="14" font-weight="700">MATHEMATICAL MODEL</text>
<text x="56" y="148" fill="#94a3b8" font-size="11">Diophantine Equation:</text>
<rect x="56" y="158" width="388" height="32" rx="6" fill="#1e293b"/>
<text x="66" y="179" fill="#38bdf8" font-size="12" font-mono font-weight="700">x₁ + x₂ + x₃ + x₄ = 100,  x_i ≥ 15</text>
<text x="56" y="214" fill="#94a3b8" font-size="11">Minimum Reserve Deduction (y_i = x_i - 15 ≥ 0):</text>
<rect x="56" y="224" width="388" height="32" rx="6" fill="#1e293b"/>
<text x="66" y="245" fill="#a7f3d0" font-size="12" font-mono font-weight="700">y₁ + y₂ + y₃ + y₄ = 100 - (4×15) = 40</text>
<text x="56" y="280" fill="#94a3b8" font-size="11">Ordinary Generating Function G(x):</text>
<rect x="56" y="290" width="388" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
<text x="66" y="313" fill="#c7d2fe" font-size="12" font-mono font-weight="700">G(x) = (x¹⁵ / (1 - x))⁴ = x⁶⁰ / (1 - x)⁴</text>
<text x="56" y="350" fill="#94a3b8" font-size="11">Negative Binomial Expansion:</text>
<rect x="56" y="360" width="388" height="32" rx="6" fill="#1e293b"/>
<text x="66" y="381" fill="#cbd5e1" font-size="11" font-mono font-weight="600">1 / (1 - x)⁴ = ∑ C(k + 3, 3) · x^k</text>
<text x="56" y="416" fill="#94a3b8" font-size="11">Target Exponent Extraction [x¹⁰⁰] G(x):</text>
<rect x="56" y="426" width="388" height="32" rx="6" fill="#1e293b"/>
<text x="66" y="447" fill="#f59e0b" font-size="12" font-mono font-weight="700">k = 100 - 60 = 40 ⟹ C(40 + 3, 3) = C(43, 3)</text>
<rect x="56" y="474" width="388" height="50" rx="8" fill="#064e3b" stroke="#10b981"/>
<text x="66" y="494" fill="#a7f3d0" font-size="11" font-weight="700">EXACT ANALYTIC VALUE:</text>
<text x="66" y="514" fill="#ffffff" font-size="15" font-mono font-weight="800">C(43, 3) = 74,046 / 6 = 12,341</text>
<rect x="490" y="90" width="430" height="450" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
<text x="506" y="120" fill="#10b981" font-size="14" font-weight="700">OPERATIONAL SCENARIOS AUDIT</text>
<rect x="506" y="145" width="398" height="64" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
<text x="516" y="163" fill="#10b981" font-size="11" font-weight="700">SCENARIO 1: NORMAL AVAILABILITY</text>
<text x="516" y="180" fill="#94a3b8" font-size="10">R = 100 kWh, m = 15 kWh | Surplus: 40 kWh</text>
<text x="516" y="197" fill="#f8fafc" font-size="11" font-mono font-weight="700">C(43, 3) = 12,341 ways</text>
<rect x="506" y="219" width="398" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
<text x="516" y="237" fill="#f59e0b" font-size="11" font-weight="700">SCENARIO 2: LIMITED MARGIN</text>
<text x="516" y="254" fill="#94a3b8" font-size="10">R = 68 kWh, m = 15 kWh | Surplus: 8 kWh</text>
<text x="516" y="271" fill="#f8fafc" font-size="11" font-mono font-weight="700">C(11, 3) = 165 ways</text>
<rect x="506" y="293" width="398" height="64" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
<text x="516" y="311" fill="#ef4444" font-size="11" font-weight="700">SCENARIO 3: CRITICAL DEFICIT</text>
<text x="516" y="328" fill="#94a3b8" font-size="10">R = 50 kWh, m = 15 kWh | Deficit: -10 kWh</text>
<text x="516" y="345" fill="#f8fafc" font-size="11" font-mono font-weight="700">0 ways (Empty set)</text>
<rect x="506" y="367" width="398" height="64" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
<text x="516" y="385" fill="#8b5cf6" font-size="11" font-weight="700">SCENARIO 4: 5 kWh STEP SIZING</text>
<text x="516" y="402" fill="#94a3b8" font-size="10">R = 100 kWh, unit = 5 kWh | R' = 8 steps</text>
<text x="516" y="419" fill="#f8fafc" font-size="11" font-mono font-weight="700">C(11, 3) = 165 ways</text>
<rect x="506" y="450" width="398" height="74" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
<text x="516" y="472" fill="#c7d2fe" font-size="11" font-weight="700">SymPy Symbolic Series Verification:</text>
<text x="516" y="490" fill="#94a3b8" font-size="10">coeff(sp.series((1-x)**-4, x, 0, 41), x, 40) ≡ 12,341</text>
<text x="516" y="510" fill="#10b981" font-size="12" font-mono font-weight="800">✓ 100% Exact Mathematical Identity Confirmed</text>
</svg>