services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agv-intelligence-backend
    ports:
      - "8000:8000"
    environment:
      - AGV_DEBUG=False
      - AGV_API_PREFIX=/api
      - AGV_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - AGV_WAREHOUSE__GRID_WIDTH=8
      - AGV_WAREHOUSE__GRID_HEIGHT=8
      - AGV_FLEET__ROBOT_COUNT=8
      - AGV_SIMULATION__TICK_INTERVAL_MS=800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: agv-intelligence-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
